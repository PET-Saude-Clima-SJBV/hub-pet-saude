# Ambiente LOCAL (roda na máquina de cada aluno).
# Uso: cp .env.example .env && docker compose up -d
name: hub-local

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: hub-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hub_local}
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
